name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  challenge:
    name: challenge + core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (ml + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Challenge acceptance (ADR-001)
        run: pytest tests/test_challenge_acceptance.py -q --tb=short

      - name: Core curriculum / phase tests
        run: pytest tests/test_phase0.py tests/test_phase1.py tests/test_phase2.py tests/test_phase5.py -q --tb=short

      - name: ADR-002 accum score-weights tests
        run: pytest tests/test_challenge_accum_score_weights.py -q --tb=short

      - name: ADR-002 factor validity tests
        run: pytest tests/test_challenge_factor_validity.py -q --tb=short

      - name: ADR-002 pre-open IEV rank tests
        run: pytest tests/test_challenge_pre_open_iev_rank.py -q --tb=short

      - name: ADR-002 pre-open directional score tests
        run: pytest tests/test_challenge_pre_open_directional_score.py -q --tb=short

      - name: ADR-002 engine portfolio tests
        run: pytest tests/test_challenge_engine.py -q --tb=short

      - name: ADR-002 champion track tests
        run: pytest tests/test_challenge_champion.py -q --tb=short

      - name: ADR-002 health + promote-packet tests
        run: pytest tests/test_challenge_health.py tests/test_challenge_promote.py -q --tb=short

      - name: Challenge CLI smoke on fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from typer.testing import CliRunner
          from ml_saham.cli.app import app
          from tests.fixtures.build_mvp_fixture import build_mvp_fixture

          runner = CliRunner()
          with TemporaryDirectory() as td:
              db = build_mvp_fixture(Path(td) / "c.db", min_bars=120)
              r = runner.invoke(
                  app,
                  [
                      "--db",
                      str(db),
                      "challenge",
                      "run",
                      "screener.accum.score_weights",
                      "--against",
                      "equal_sleeves",
                      "--no-artifact",
                  ],
              )
              assert r.exit_code in (0, 2), r.stdout
              assert "POLICY CHALLENGE" in r.stdout or "BLOCKED" in r.stdout
              print("challenge run CLI smoke OK", r.exit_code)
          PY
